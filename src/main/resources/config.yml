# djinqSpawn made by djinq

# teleport ~ settings for /spawn
teleport:
  # delay before teleport ~ 0 teleports instantly
  delay-seconds: 3

  # cancel teleport when
  cancel-on:
    movement: true
    damage: true
    world-change: true

  # small position changes at or below this distance are ignored
  movement-tolerance: 0.05

  # countdown messages while waiting
  countdown:
    action-bar: true
    chat-message: true

# first join ~ teleport new players to spawn
first-join:
  teleport-to-spawn: true

# sounds ~ set enabled false to mute a sound
sounds:
  countdown:
    enabled: true
    name: 'minecraft:ui.button.click'
    volume: 0.6
    pitch: 1.2

  teleport:
    enabled: true
    name: 'minecraft:entity.enderman.teleport'
    volume: 0.7
    pitch: 1.2

  cancelled:
    enabled: true
    name: 'minecraft:block.note_block.bass'
    volume: 0.5
    pitch: 0.8
